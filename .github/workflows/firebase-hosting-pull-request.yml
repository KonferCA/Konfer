name: Deploy to Firebase Hosting on PR
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build_and_preview:
    if: github.base_ref == 'live' || github.ref == 'refs/heads/live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build project
        run: pnpm build
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KONFER_SITE }}
          expires: 30d
          projectId: konfer-site
